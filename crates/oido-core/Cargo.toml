# Soporte de TTS (Fase TTS: lectura de selección). Solo necesario si la
# feature está activa — pero para v1 mantenemos el crate linkado siempre
# porque ya compila y mantener una feature-flag aquí añade fricción sin
# ganancia de startup time significativa.
[dev-dependencies]
tempfile.workspace = true
